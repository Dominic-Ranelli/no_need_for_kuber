[project]
name = "ml-inference-platform"
version = "0.2.0"
description = "A production-grade ML inference service built with FastAPI and scikit-learn"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "httpx2>=2.14.0",
    "pyyaml>=6.0.3",
    "pandas>=2.3.3",
    "toml-cli>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.fastapi]
app.entrypoint = "main:app"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]


[tool.setuptools]
packages = ["app"]
